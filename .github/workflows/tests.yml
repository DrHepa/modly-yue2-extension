name: Python contract and adapter tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.2.6 soundfile==0.13.1
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m compileall -q yue2_modly processor.py setup.py tools
      - run: python -m unittest discover -s tests -v
# Hosted runners are CPU-only. A green workflow is NOT CUDA / full-model certification.
